function compensiGiaFatti(sid){ return (S.cassaMov||[]).some(m=>m.serata_id===sid&&m.categoria==='Personale'); }
function compensiChiedi(){
  const cons=S.serate.filter(s=>s.stato==='consuntivo'||s.chiusa_il).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,20);
  $('#modalbody').innerHTML=`
    <div class="serif" style="font-size:19px;margin-bottom:4px">Compensi del personale</div>
    <div class="dim" style="font-size:12.5px;line-height:1.55;margin-bottom:14px">Scegli la serata: registro in cassa quello che hai pagato ai ragazzi in turno, così il saldo torna al contante che hai davvero.</div>
    ${cons.map(s=>{const c=compensiSerata(s.id), tot=c.reduce((t,x)=>t+x.imp,0), fatto=compensiGiaFatti(s.id);
      if(!tot)return '';
      return `<button class="btn btn-ghost" style="width:100%;text-align:left;margin-bottom:7px;display:flex;align-items:center;gap:9px;${fatto?'opacity:.55':''}" onclick="compensiRegistra(${s.id})">
        ${fatto?'<span style="color:#4bb573;flex:none">✓</span>':''}
        <span style="flex:1;text-transform:capitalize">${esc(fmtDay(s.data))}<br><span class="dim" style="font-size:11px;text-transform:none">${c.length} persone · ${esc(c.map(x=>x.nome).join(', ')).slice(0,52)}</span></span>
        <b style="flex:none">${eur(tot)}</b></button>`;}).join('')||'<div class="dim" style="font-size:13px">Nessuna serata con compensi da registrare.</div>'}
    <button class="btn btn-ghost" style="width:100%;margin-top:6px" onclick="hideModal()">Chiudi</button>`;
  showModal();
}
async function compensiRegistra(sid){
  const s=S.serate.find(x=>x.id===sid); if(!s)return;
  const c=compensiSerata(sid), tot=c.reduce((t,x)=>t+x.imp,0);
  if(!tot)return;
  if(compensiGiaFatti(sid)&&!confirm('Per '+fmtDay(s.data)+' i compensi risultano già registrati in cassa.\n\nNe aggiungo un altro?'))return;
  const conto=confirm('Registro '+eur(tot)+' di compensi per '+fmtDay(s.data)+'.\n\n'+c.map(x=>'· '+x.nome+' '+eur(x.imp)).join('\n')+'\n\nOK = pagati in CONTANTI · Annulla = scelgo POS')?'contanti':'pos';
  const r=await db.from('cassa_mov').insert({data:s.data,conto:conto,tipo:'uscita',importo:tot,
    voce:'Personale',categoria:'Personale',serata_id:sid,
    note:'Compensi del personale in turno: '+c.map(x=>x.nome+' '+x.imp).join(', ')});
  if(r.error){toast('Errore: '+r.error.message);return;}
  hideModal(); await reloadAll(); render();
  toast('Registrati '+eur(tot)+' su '+(conto==='contanti'?'contanti':'POS'));
}
function renderCassa(){
  const t=cassaSaldi(), da=cassaDaAssegnare(), L=cassaLedger();
  let h='';
  if(S.cassaMovErr){
    h+=`<div class="warnbox" style="margin-bottom:12px">⚠️ Migration mancante: la tabella <b>cassa_mov</b> non esiste ancora. I saldi si calcolano lo stesso su incassi e costi, ma non puoi registrare movimenti liberi.

  }
  h+=`<div class="grid2" style="margin-bottom:10px">
    <div class="card kpi"><div class="v" style="color:${t.contanti.saldo>=0?'var(--text)':'#f87171'}">${eur(t.contanti.saldo)}</div><div class="label" style="margin-top:2px">💵 contanti in cassa</div></div>
    <div class="card kpi"><div class="v" style="color:${t.pos.saldo>=0?'var(--text)':'#f87171'}">${eur(t.pos.saldo)}</div><div class="label" style="margin-top:2px">💳 POS / banca</div></div>
  </div>
  <div class="card" style="padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">

    <div class="serif" style="font-size:23px;color:var(--accent)">${eur(t.totale)}</div>
  </div>`;

  {
    const eS=econStagione(), acq=valoreAcquisti();
    const naC=da.costi.reduce((x,y)=>x+Number(y.importo||0),0);   // uscite non ancora assegnate
    const naE=da.extra.reduce((x,y)=>x+Number(y.importo||0),0);   // entrate non ancora assegnate
    // i compensi già registrati in cassa hanno GIÀ abbassato la liquidità: sottrarli di
    // nuovo qui li conterebbe due volte, ed è quello che faceva comparire una differenza
    // non spiegata pari esattamente a quanto avevi registrato.
    const persInCassa=(S.cassaMov||[]).filter(m=>m.categoria==='Personale'&&m.tipo==='uscita')

    const resid=t.totale-naC+naE-persDaRegistrare-eS.cogs-eS.margine;
    h+=`<div class="card" style="padding:16px;margin-bottom:12px">
      <div class="label" style="margin-bottom:4px">Riconciliazione cassa ↔ margine</div>
      <div class="dim" style="font-size:12px;line-height:1.5;margin-bottom:10px">Perché la liquidità non coincide col margine di stagione. Non sono errori: sono le voci che pesano sul margine senza passare dalla cassa, o viceversa.</div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span class="muted">Liquidità in cassa</span><b>${eur(t.totale)}</b></div>

      ${naE>0?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:var(--accent)">+ Entrate extra senza metodo <span style="opacity:.7">· ${da.extra.length} da assegnare</span></span><span style="color:var(--accent)">${eur(naE)}</span></div>`:''}
      ${persDaRegistrare>0?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span class="dim">− Personale in turno <span style="opacity:.7">· non ancora registrato in cassa</span></span><span>${eur(persDaRegistrare)}</span></div>`:''}
      ${persInCassa>0?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px"><span class="dim" style="opacity:.75">Compensi già registrati in cassa <span style="opacity:.7">· su ${eur(eS.personale)} di turni assegnati</span></span><span class="dim">${eur(persInCassa)}</span></div>`:''}

      ${Math.abs(resid)>1?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:#f87171">− Differenza non spiegata <span style="opacity:.7">· qualcosa non quadra, guarda i movimenti</span></span><span style="color:#f87171">${eur(resid)}</span></div>`:''}
      <div style="display:flex;justify-content:space-between;padding:10px 0 0;margin-top:8px;border-top:1px solid var(--border);align-items:center"><span class="serif" style="font-size:16px">Margine di stagione</span><span class="serif" style="font-size:20px;color:${eS.margine>=0?'#4bb573':'#f87171'}">${eur(eS.margine)}</span></div>

  h+=`<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">

  h+=`<div class="grid2" style="margin-bottom:12px">${['contanti','pos'].map(k=>`
    <div class="card" style="padding:14px">
      <div class="label" style="margin-bottom:8px">${contoLbl(k)}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span class="dim">Saldo iniziale</span><span>${eur(t[k].iniz)}</span></div>

      <div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span class="dim">− Uscite</span><span style="color:#f87171">${eur(t[k].uscite)}</span></div>

      <div style="display:flex;justify-content:space-between;padding:8px 0 0;margin-top:6px;border-top:1px solid var(--border)"><b style="font-size:13px">Saldo</b><b style="font-size:15px">${eur(t[k].saldo)}</b></div>
    </div>`).join('')}</div>`;

  if(da.n){
    h+=`<div class="card" style="padding:14px;margin-bottom:12px;border-color:var(--accent)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <div class="label">Da assegnare · ${da.n}</div><div style="font-size:13px">${eur(da.tot)}</div></div>
      <div class="dim" style="font-size:12px;margin-bottom:10px">Queste voci non hanno ancora un metodo di pagamento: finché non lo assegni non toccano i saldi.</div>
      ${da.costi.slice(0,25).map(x=>{const s=S.serate.find(y=>y.id===x.serata_id);return `<div class="srow">
        <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">${esc(x.voce||'Costo')}</div><div class="dim" style="font-size:12px">− ${eur(x.importo)}${s?' · '+esc(fmtShort(s.data)):''}</div></div>
        <button class="btn btn-sm btn-ghost" style="flex:none" onclick="cassaSetMetodo('costi_serata',${x.id},'contanti')">💵</button>
        <button class="btn btn-sm btn-ghost" style="flex:none" onclick="cassaSetMetodo('costi_serata',${x.id},'pos')">💳</button></div>`;}).join('')}
      ${da.extra.slice(0,25).map(x=>{const s=S.serate.find(y=>y.id===x.serata_id);return `<div class="srow">
        <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">${esc(x.voce||'Extra')}</div><div class="dim" style="font-size:12px">+ ${eur(x.importo)}${s?' · '+esc(fmtShort(s.data)):''}</div></div>
        <button class="btn btn-sm btn-ghost" style="flex:none" onclick="cassaSetMetodo('incassi_extra',${x.id},'contanti')">💵</button>
        <button class="btn btn-sm btn-ghost" style="flex:none" onclick="cassaSetMetodo('incassi_extra',${x.id},'pos')">💳</button></div>`;}).join('')}
      ${da.n>50?`<div class="dim" style="font-size:12px;margin-top:8px">…e altre ${da.n-50}</div>`:''}
    </div>`;
  }

  h+=`<div style="display:flex;gap:8px;margin:16px 0 10px;overflow-x:auto">
    <span class="chip ${cassaFiltro==='tutti'?'on':''}" style="cursor:pointer" onclick="cassaFiltro='tutti';renderSerate()">Tutti</span>
    <span class="chip ${cassaFiltro==='contanti'?'on':''}" style="cursor:pointer" onclick="cassaFiltro='contanti';renderSerate()">💵 Contanti</span>
    <span class="chip ${cassaFiltro==='pos'?'on':''}" style="cursor:pointer" onclick="cassaFiltro='pos';renderSerate()">💳 POS / banca</span>

  const list=L.filter(r=>cassaFiltro==='tutti'||r.conto===cassaFiltro);

  list.slice(0,300).forEach(r=>{
    const m=r.data?new Date(r.data+'T00:00:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'}):'senza data';
    if(m!==curM){curM=m;h+=`<div class="label" style="margin:16px 0 8px;text-transform:capitalize">${esc(m)}</div>`;}
    const click=r.src==='mov'?`onclick="openCassaMov(${r.id})"`:(r.src==='serata'?`onclick="openChiusura(${r.id},0)"`:(r.src==='quota'?`onclick="openChiusura(${r.id},2)"`:''));
    const dest=r.conto==='pos'?'contanti':'pos';
    h+=`<div class="card ${click?'tap':''}" ${click} style="padding:11px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px">

      ${r.sw?`<button class="cbtn" style="width:36px;height:36px;flex:none;font-size:15px" title="sposta su ${dest==='pos'?'POS / banca':'contanti'}" onclick="event.stopPropagation();cassaSposta('${r.sw}',${r.id},'${dest}')">${dest==='pos'?'💳':'💵'}</button>`:''}
    </div>`;

  h+=`<div class="card" style="padding:14px;margin-top:18px">
    <div class="label" style="margin-bottom:10px">⚙️ Saldi iniziali</div>
    <div class="dim" style="font-size:12px;margin-bottom:10px">Fondo cassa e saldo banca a inizio stagione, prima di ogni movimento registrato qui.</div>
    <div class="grid2 field">
      <div><div class="label" style="margin-bottom:6px">💵 Contanti</div><input id="si_cash" type="number" step="0.01" class="input" placeholder="0" value="${t.contanti.iniz||''}"></div>
      <div><div class="label" style="margin-bottom:6px">💳 POS / banca</div><input id="si_pos" type="number" step="0.01" class="input" placeholder="0" value="${t.pos.iniz||''}"></div>
    </div>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="cassaSaveIniz()">Salva saldi iniziali</button>
  </div>
  <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="printCassa()">🖨 Estratto conto (stampa / PDF)</button>`;
  return h;
}
function cassaCopySql(){try{navigator.clipboard.writeText(CASSA_SQL);toast('SQL copiato: incollalo nello SQL Editor di Supabase');}catch(e){alert(CASSA_SQL);}}
async function cassaSaveIniz(){
  await db.from('config').upsert({chiave:'saldo_iniz_contanti',valore:String(Number($('#si_cash').value)||0)});
  await db.from('config').upsert({chiave:'saldo_iniz_pos',valore:String(Number($('#si_pos').value)||0)});
  await reloadAll();render();toast('Saldi iniziali salvati');
}
// sposta un pagamento da un conto all'altro con un tap
async function cassaSposta(kind,id,dest){
  let r;
  if(kind==='costo')      r=await db.from('costi_serata').update({metodo:dest}).eq('id',id);
  else if(kind==='extra') r=await db.from('incassi_extra').update({metodo:dest}).eq('id',id);
  else if(kind==='mov')   r=await db.from('cassa_mov').update({conto:dest}).eq('id',id);
  else if(kind==='quota') r=await db.from('serate').update({metodo_quota_org:dest}).eq('id',id);
  else return;
  if(r&&r.error)return alert('Non riesco a spostarlo: '+r.error.message+(kind==='quota'?'\n\nServe la migration SQL (colonna "metodo_quota_org" su serate).':''));
  await reloadAll();render();
  toast(dest==='pos'?'→ 💳 POS / banca':'→ 💵 Contanti');
}
async function cassaSetMetodo(tab,id,m){
  const r=await db.from(tab).update({metodo:m}).eq('id',id);
  if(r.error)return alert('Serve la migration SQL (colonna "metodo" su '+tab+'):\n'+r.error.message);
  await reloadAll();render();toast(m==='pos'?'💳 POS / banca':'💵 Contanti');
}

let CM=null;
function openCassaMov(id,tipo){
  const x=id?(S.cassaMov||[]).find(y=>y.id===id):null;
  CM=x?{...x}:{id:null,data:today(),conto:'contanti',tipo:tipo||'uscita',importo:'',voce:'',categoria:'',serata_id:null};
  drawCassaMov();showModal();
}
function cmSet(k,v){CM[k]=v;cmGrab();drawCassaMov();}
function cmGrab(){const g=i=>{const e=document.getElementById(i);return e?e.value:undefined;};
  const v=g('cm_imp');if(v!==undefined)CM.importo=v;
  const w=g('cm_voce');if(w!==undefined)CM.voce=w;
  const d=g('cm_data');if(d!==undefined)CM.data=d;}

    <input id="cm_voce" class="input" placeholder="${giro?'es. Versamento settimanale':'es. Acquisto ghiaccio, benzina, acconto DJ'}" value="${esc(CM.voce||'')}"></div>

  <button class="btn btn-accent" style="width:100%" onclick="saveCassaMov()">Salva</button>

async function saveCassaMov(){
  cmGrab();
  const imp=Number(String(CM.importo).replace(',','.'));
  if(!imp||isNaN(imp)||imp<=0)return alert('Inserisci un importo maggiore di zero');
  const row={data:CM.data||today(),conto:CM.conto||'contanti',tipo:CM.tipo||'uscita',importo:Math.abs(imp),
    voce:(CM.voce||'').trim()||null,categoria:CM.tipo==='giroconto'?null:(CM.categoria||null),
    serata_id:CM.tipo==='giroconto'?null:(CM.serata_id||null)};
  const r=CM.id?await db.from('cassa_mov').update(row).eq('id',CM.id):await db.from('cassa_mov').insert(row);
  if(r.error)return alert('Errore: '+r.error.message+'\n\nSe la tabella non esiste, esegui la migration SQL (bottone in cima alla Cassa).');
  await reloadAll();hideModal();render();toast('Movimento salvato');
}
async function delCassaMov(id){
  if(!confirm('Eliminare questo movimento?'))return;
  await db.from('cassa_mov').delete().eq('id',id);
  await reloadAll();hideModal();render();
}

let CH=null;
const EXTIPI=[['sponsor','Sponsor'],['partnership','Partnership'],['cabana','Cabana / min-spend'],['ingressi','Ingressi'],['altro','Altro']];
const COSTCAT=['Personale bar','Security','Accoglienza','Rimborsi spese','Artisti / DJ','SIAE','Altro'];
// voci che compaiono già pronte alla chiusura: basta scriverci l'importo
const COSTPRESET=['Personale bar','Security','Accoglienza'];
let CHMET='contanti';
async function chCicloMetodo(id){
  const x=S.costiSerata.find(y=>y.id===id);if(!x)return;
  const cur=nMetodo(x), next=cur==='contanti'?'pos':(cur==='pos'?null:'contanti');
  const r=await db.from('costi_serata').update({metodo:next}).eq('id',id);
  if(r.error)return alert('Serve la migration SQL (colonna "metodo"): '+r.error.message);
  await reloadAll();drawChiusura();
}
function tipoLabel(t){const m={sponsor:'Sponsor',partnership:'Partnership',cabana:'Cabana / min-spend',ingressi:'Ingressi',altro:'Extra'};return m[t]||'Extra';}
function segSel(el){el.parentElement.querySelectorAll('span').forEach(x=>x.classList.remove('on'));el.classList.add('on');}
function segVal(id){const e=document.querySelector('#'+id+' span.on');return e?e.dataset.v:null;}
function openChiusura(sid,step){const s=S.serate.find(x=>x.id===sid);if(!s)return;CH={sid,step:step!=null?step:0};drawChiusura();showModal();}
function chS(){return S.serate.find(x=>x.id===CH.sid)||{};}
/* Chiusura in 3 passaggi: Incassi · Extra e costi · Riepilogo.
   La checklist licenze/staff non è un dato economico: è diventata una fascia
   di avviso in cima al riepilogo, dove serve davvero. */
function drawChiusura(){
  const s=chS(), step=CH.step, steps=['Incassi','Extra e costi','Riepilogo'];
  let body='';
  if(step===0)body=chStep1(s);
  else if(step===1)body=chStep2(s)+`<div style="height:18px"></div>`+chStep3(s);
  else body=chStep0(s)+chStep4(s);
  $('#modalbody').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px">
      <div><div class="serif" style="font-size:19px">${s.stato==='consuntivo'?'Risultati serata':'Chiudi serata'}</div><div class="dim" style="font-size:12px;text-transform:capitalize">${esc(fmtDay(s.data))} · ${esc(tipById(s.tipologia_id)?.nome||'')}</div></div>
      <button onclick="hideModal()" class="btn btn-sm btn-ghost">Chiudi</button></div>
    <div class="wsteps">${steps.map((x,i)=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div>
    <div class="label" style="margin-bottom:10px">${step+1}/${steps.length} · ${steps[step]}</div>
    ${body}
    <div style="display:flex;gap:8px;margin-top:16px;position:sticky;bottom:0;background:var(--bg2);padding:10px 0 4px">
      ${step>0?`<button class="btn btn-ghost" onclick="chGo(${step-1})">←</button>`:''}
      ${step<2?`<button class="btn btn-accent" style="flex:1" onclick="chGo(${step+1})">Avanti →</button>`:''}
    </div>`;
  numpad(document.getElementById('modalbody'));
}
async function chGo(n){if(CH.step===0)await chSaveIncassi();CH.step=n;drawChiusura();}
async function chFlag(f,v){const o={};o[f]=v;const r=await db.from('serate').update(o).eq('id',CH.sid);if(r.error)return alert(r.error.message);await reloadAll();drawChiusura();}
function chStep0(s){
  const a=assetto(s),ass=assegnati(s.id),gate=gateLegale(s);
  const ok1=!gate||(s.siae_ok&&s.pubblico_spettacolo_ok), ok2=ass.length>=a.totMin;
  // tutto a posto: una riga sola, senza rubare spazio al riepilogo
  if(ok1&&ok2)return `<div class="dim" style="font-size:12px;margin-bottom:12px;color:#4bb573">✓ Licenze a posto · ${ass.length} in staff</div>`;
  return `
  <div class="card" style="padding:14px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="label">Licenze</div><span class="pill" style="background:${ok1?'rgba(75,181,115,.16)':'rgba(239,68,68,.16)'};color:${ok1?'#4bb573':'#f87171'}">${ok1?'in regola':'da chiudere'}</span></div>
    ${gate?`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="chip ${s.siae_ok?'on':''}" style="cursor:pointer;padding:9px 13px" onclick="chFlag('siae_ok',${s.siae_ok?'false':'true'})">SIAE ${s.siae_ok?'✓':''}</span>
      <span class="chip ${s.pubblico_spettacolo_ok?'on':''}" style="cursor:pointer;padding:9px 13px" onclick="chFlag('pubblico_spettacolo_ok',${s.pubblico_spettacolo_ok?'false':'true'})">Pubblico spettacolo ${s.pubblico_spettacolo_ok?'✓':''}</span></div>`
      :'<div class="dim" style="font-size:13px">Non richieste per questa serata.</div>'}
  </div>
  <div class="card" style="padding:14px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="label">Staff</div><span class="pill" style="background:${ok2?'rgba(75,181,115,.16)':'rgba(239,68,68,.16)'};color:${ok2?'#4bb573':'#f87171'}">${ass.length} assegnati · min ${a.totMin}</span></div>
    ${ass.length?`<div class="dim" style="font-size:12px;margin-top:8px">${ass.map(x=>esc((S.personale.find(p=>p.id===x.personale_id)||{}).nome||'?')).join(' · ')}</div>`:'<div class="dim" style="font-size:12px;margin-top:8px">Nessuno assegnato: il costo personale risulterà €0.</div>'}
    <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="openSerata(${s.id})">Gestisci staff nella scheda serata</button>
  </div>
  ${s.stato==='bozza'?`<div class="warnbox">La serata è ancora in <b>bozza</b>: a fine wizard passa direttamente a consuntivo.</div>`:''}`;
}
function chReconHtml(tot,cash,pos,vTot){
  const T=n=>(n==null||n==='')?null:Number(n);
  tot=T(tot);cash=T(cash);pos=T(pos);
  const msgs=[];
  if(tot!=null&&cash!=null&&pos!=null){const d=Math.round((cash+pos-tot)*100)/100;
    if(Math.abs(d)>0.01)msgs.push(`<div class="warnbox">⚠️ Contanti + POS = ${eur(cash+pos)} ≠ totale ${eur(tot)} (diff. ${eur(d)})</div>`);
    else msgs.push(`<div class="okbox">✓ Contanti + POS quadrano col totale</div>`);}
  if(tot!=null&&vTot>0){const d=tot-vTot;if(Math.abs(d)>Math.max(20,tot*0.05))msgs.push(`<div class="dim" style="font-size:12px;margin-top:6px">Dettaglio vendite ${eur(vTot)} vs incasso ${eur(tot)}: scostamento ${eur(d)}. Fa fede l'incasso totale.</div>`);}
  return msgs.join('');
}
function chSync(src){
  const g=id=>{const e=document.getElementById(id);return e&&e.value!==''?Number(e.value):null;};
  const r2=n=>Math.round(n*100)/100;
  let tot=g('ch_tot'),cash=g('ch_cash'),pos=g('ch_pos');
  if((src==='cash'||src==='pos')&&cash!=null&&pos!=null){document.getElementById('ch_tot').value=r2(cash+pos);tot=cash+pos;}
  else if(src==='tot'&&tot!=null&&cash!=null&&pos==null){document.getElementById('ch_pos').value=r2(Math.max(0,tot-cash));pos=Math.max(0,tot-cash);}
  else if(src==='tot'&&tot!=null&&pos!=null&&cash==null){document.getElementById('ch_cash').value=r2(Math.max(0,tot-pos));cash=Math.max(0,tot-pos);}
  const vTot=S.vendite.filter(v=>v.serata_id===CH.sid).reduce((t,v)=>t+Number(v.quantita||0)*Number(v.prezzo_unitario||0),0);

function chStep4(s){

  if(e.extraDaInc>0)warn.push(`${eur(e.extraDaInc)} di extra ancora da incassare.`);
  return `
  ${ceTable(e,s.incasso_target?Number(s.incasso_target):null)}
  ${warn.length?`<div class="warnbox" style="margin-bottom:12px">${warn.map(w=>'⚠️ '+w).join('<br>')}</div>`:`<div class="okbox" style="margin-bottom:12px">✓ Tutto quadra.</div>`}

  if(r.error)return alert('Errore: '+r.error.message+'\n→ Se la tabella non esiste, esegui le migration SQL su Supabase.');
  await reloadAll();hideModal();toast('Accordo salvato');render();
}
async function delPartnership(id){if(!confirm('Eliminare l\'accordo?'))return;await db.from('partnership').delete().eq('id',id);await reloadAll();hideModal();render();}
async function incassaPartnership(pid,sid,from){
  const p=S.partnership.find(x=>x.id===pid);if(!p)return;
  const serata=sid||p.serata_id;
  if(!serata)return alert('Prima collega una serata all\'accordo (aprilo e scegli la serata).');
  const row={serata_id:serata,voce:p.titolo,importo:Number(p.valore||0),tipo:'sponsor',stato:'incassato',partnership_id:pid};
  let r=await db.from('incassi_extra').insert(row);
  if(r.error){delete row.tipo;delete row.stato;delete row.partnership_id;r=await db.from('incassi_extra').insert(row);}
  if(r.error)return alert(r.error.message);
  await db.from('partnership').update({stato:'incassato',serata_id:serata}).eq('id',pid);
  await reloadAll();toast('Incassato '+eur(p.valore)+' ✓');
  if(from==='ch')drawChiusura();else render();
}

function duplicaSerata(id){
  const s=S.serate.find(x=>x.id===id);if(!s)return;
  const free=seasonDays().filter(x=>!x.serata&&x.date>today());
  $('#modalbody').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px"><div class="serif" style="font-size:19px">Duplica serata</div><button onclick="hideModal()" class="btn btn-sm btn-ghost">Chiudi</button></div>

    <button class="btn btn-accent" style="width:100%" onclick="doDuplica(${id})">⧉ Duplica</button>`;

async function doDuplica(id){
  const s=S.serate.find(x=>x.id===id);if(!s)return;
  const d=$('#dup_data').value;if(!d)return alert('Scegli la data');
  const o={...s};['id','created_at','incasso_totale','incasso_contanti','incasso_pos','chiusa_il','cabane_vendute'].forEach(k=>delete o[k]);
  o.data=d;o.stato='bozza';o.siae_ok=false;o.pubblico_spettacolo_ok=false;
  const r=await db.from('serate').insert(o).select().single();
  if(r.error)return alert('Errore: '+r.error.message);
  const ass=assegnati(id);
  if(ass.length&&r.data)await db.from('serata_personale').insert(ass.map(a=>({serata_id:r.data.id,personale_id:a.personale_id,ruolo:a.ruolo})));
  await reloadAll();toast('Serata duplicata ✓');if(r.data)openSerata(r.data.id);else{hideModal();render();}
}

function openSearch(){
  $('#modalbody').innerHTML=`
    <div style="display:flex;gap:8px;align-items:center;margin:2px 0 12px">
      <input id="gs_q" class="input" placeholder="Cerca serate, contatti, articoli…" oninput="searchDo(this.value)" style="flex:1">
      <button onclick="hideModal()" class="btn btn-sm btn-ghost">Chiudi</button></div>
    <div id="gs_res"><div class="dim" style="font-size:13px">Scrivi almeno 2 caratteri.</div></div>`;
  showModal();
  setTimeout(()=>{const e=document.getElementById('gs_q');if(e)e.focus();},100);
}
function gsRow(oc,title,sub,icon){return `<div class="card tap" onclick="hideModal();${oc}" style="padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer"><span style="font-size:16px;flex:none">${icon}</span><div style="min-width:0"><div style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div><div class="dim" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</div></div></div>`;}
function searchDo(q){
  const el=document.getElementById('gs_res');if(!el)return;
  q=(q||'').trim().toLowerCase();
  if(q.length<2){el.innerHTML='<div class="dim" style="font-size:13px">Scrivi almeno 2 caratteri.</div>';return;}
  const M=s=>(s||'').toLowerCase().includes(q);
  let h='';
  const ser=S.serate.filter(s=>M(fmtDay(s.data))||M(tipById(s.tipologia_id)?.nome)||M(s.note)||M((S.contatti.find(c=>c.id===s.organizzatore_id)||{}).nome)).slice(0,6);
  if(ser.length)h+=`<div class="label" style="margin:4px 0 8px">Serate</div>`+ser.map(s=>gsRow(`openSerata(${s.id})`,esc(fmtDay(s.data)),esc(tipById(s.tipologia_id)?.nome||'')+' · '+s.stato,'📅')).join('');
  const con=S.contatti.filter(c=>M(c.nome)||M(c.ruolo)||M(c.categoria)).slice(0,6);
  if(con.length)h+=`<div class="label" style="margin:12px 0 8px">Rubrica</div>`+con.map(c=>gsRow(`openCont(${c.id})`,esc(c.nome),esc(c.ruolo||c.categoria||''),'📇')).join('');
  const art=S.articoli.filter(a=>M(a.nome)).slice(0,6);
  if(art.length)h+=`<div class="label" style="margin:12px 0 8px">Magazzino</div>`+art.map(a=>gsRow(`openArticolo(${a.id})`,esc(a.nome),'giacenza '+giacenza(a.id)+' '+esc(a.unita||''),'📦')).join('');
  const pro=S.prodotti.filter(p=>M(p.nome)).slice(0,6);
  if(pro.length)h+=`<div class="label" style="margin:12px 0 8px">Listino</div>`+pro.map(p=>gsRow(`openProdotto(${p.id})`,esc(p.nome),eur(p.prezzo_vendita),'🍸')).join('');
  const td=S.todo.filter(t=>M(t.testo)&&!t.fatto).slice(0,6);
  if(td.length)h+=`<div class="label" style="margin:12px 0 8px">To-do</div>`+td.map(t=>gsRow(`openTodo(${t.id})`,esc(t.testo),t.scadenza?('scad. '+fmtShort(t.scadenza)):'','✔️')).join('');
  const nt=S.note.filter(n=>M(n.titolo)||M(n.contenuto)).slice(0,4);
  if(nt.length)h+=`<div class="label" style="margin:12px 0 8px">Appunti</div>`+nt.map(n=>gsRow(`openNota(${n.id})`,esc(n.titolo||'Senza titolo'),esc((n.contenuto||'').slice(0,60)),'📝')).join('');
  const pa=S.partnership.filter(p=>M(p.titolo)||M(p.note)).slice(0,4);
  if(pa.length)h+=`<div class="label" style="margin:12px 0 8px">Sponsor</div>`+pa.map(p=>gsRow(`openPartnership(${p.id})`,esc(p.titolo),eur(p.valore)+' · '+p.stato,'🤝')).join('');
  el.innerHTML=h||'<div class="dim" style="font-size:13px">Nessun risultato per "'+esc(q)+'".</div>';
}

/* ================= NOTIFICHE PUSH DEL GESTIONALE =================
   Promemoria "serata chiusa ma merce non scaricata": arrivano dal server
   (edge function push-send + cron) alle 03, 12, 14, 17 e 21.
   Si spengono da sole appena lo scarico esiste. */
const GPUSH_SECRET="34b9a32398361e109f8b05e966ebc9ed";
function gPushOk(){return ('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);}
function gStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function gIsIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function gPushAttivo(){return localStorage.getItem('cc_push_on')==='1'&&('Notification' in window)&&Notification.permission==='granted';}

async function gPushIscrivi(){
  if(!('Notification' in window))throw new Error('Questo browser non supporta le notifiche.');
  const perm=await Notification.requestPermission();
  if(perm!=='granted')throw new Error('Permesso negato. Attivalo nelle impostazioni del telefono.');
  if(!gPushOk())throw new Error('Questo browser non supporta le notifiche ad app chiusa.');
  const reg=await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pB64(PVAPID)});
  const j=sub.toJSON();
  const r=await db.rpc('gest_push_subscribe',{secret:GPUSH_SECRET,p_endpoint:sub.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_label:(navigator.userAgent||'').slice(0,60)});
  if(r.error)throw new Error(r.error.message);
  localStorage.setItem('cc_push_on','1');
  localStorage.setItem('cc_push_novita',GPUSH_NOVITA);   // ha appena visto le zone, non glielo ripropongo
  localStorage.removeItem('cc_push_rinvio');
  return true;
}
async function gPushBottone(btnId,statId){
  const b=document.getElementById(btnId),st=document.getElementById(statId);
  const set=(t,c)=>{if(st){st.textContent=t;st.style.color=c||'';}};
  if(b){b.disabled=true;b.textContent='Attivazione…';}
  try{
    await gPushIscrivi();
    set('✓ Notifiche attive su questo dispositivo, anche ad app chiusa.','#4bb573');
    try{new Notification('KIRKE',{body:'Notifiche attive su questo dispositivo.',tag:'kirke-test'});}catch(e){}
    if(b){b.disabled=false;b.textContent='🔔 Riattiva';}
    setTimeout(()=>{if(document.getElementById('gpushPop'))hideModal();},900);
    if(TAB==='setup')render();
  }catch(e){
    set(e.message,'#f87171');
    if(b){b.disabled=false;b.textContent='🔔 Attiva notifiche';}
  }
}
async function gPushDisattiva(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await db.rpc('gest_push_unsubscribe',{secret:GPUSH_SECRET,p_endpoint:sub.endpoint});await sub.unsubscribe();}
  }catch(e){}
  localStorage.removeItem('cc_push_on');
  toast('Notifiche disattivate su questo dispositivo');
  if(TAB==='setup')render();
}

/* Il service worker parla alla finestra già aperta. Il messaggio può arrivare mentre sei
   ancora alla password o mentre i dati stanno caricando: in quel caso lo tengo da parte
   e lo applico appena l'app è pronta, invece di perderlo. */
let _goPending=null;
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',ev=>{
    const u=ev.data&&ev.data.kirkeGo; if(!u)return;
    let qs; try{ qs=new URL(u,location.origin).searchParams; }catch(e){ return; }
    if(document.getElementById('app').classList.contains('hidden')||!S.serate.length){ _goPending=qs; return; }
    gDeepLink(qs);
  });
}
async function gDeepLink(qs){
  const go=(qs.get('go')||'').toLowerCase();
  if(!go)return false;
  const sid=+qs.get('serata')||0;
  const f=GDEST[go];
  try{
    if(f){ await f(sid); }
    else { gotoTab('home'); toast('Notifica non riconosciuta: '+go); }
  }catch(e){ gotoTab('home'); toast('Non sono riuscito ad aprire: '+go); }
  return true;
}
async function gPushBoot(){
  const qs=new URLSearchParams(location.search);
  let salta=false;
  try{ salta=await gDeepLink(qs); }catch(e){}
  if(qs.get('go')){ try{history.replaceState(null,'',location.pathname);}catch(e){} }
  if(_goPending){ const q=_goPending; _goPending=null; try{ await gDeepLink(q); salta=true; }catch(e){} }
  if(salta||MAGONLY)return;
  if(gPushAttivo()){
    // leggo PRIMA di rinfrescare: gPushIscrivi marca la novità come vista e mi spegnerebbe il popup
    const daVedere = localStorage.getItem('cc_push_novita')!==GPUSH_NOVITA;
    try{await gPushIscrivi();}catch(e){}                              // rinfresca la subscription
    // chi ha già attivato non deve perdersi le novità: gliela mostro una volta sola
    if(daVedere){ localStorage.removeItem('cc_push_novita'); setTimeout(()=>gPushPopup(1),1200); }
    return;
  }
  const rinvio=+(localStorage.getItem('cc_push_rinvio')||0);
  if(rinvio&&Date.now()<rinvio)return;
  if(!('Notification' in window)||Notification.permission==='denied')return;
  setTimeout(gPushPopup,1200);
}

function showModal(){document.getElementById('modal').classList.remove('hidden');document.body.classList.add('locked');const sh=document.querySelector('#modal .sheet');if(sh)sh.scrollTop=0;numpad(document.getElementById('modalbody'));}
function hideModal(){document.getElementById('modal').classList.add('hidden');document.body.classList.remove('locked');ECON_FROM=null;}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')hideModal();});
</script>
